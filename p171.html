<html>
    <head>
        <meta charset="utf-8"/>
    </head>
    <body>
        <canvas id="mycanvas" width="600" height="400" style="border:3px solid">
        </canvas>
        <script type="text/javascript">
            var ctx=document.getElementById("mycanvas");
            var myContext=ctx.getContext("2d");

            myContext.strokeRect(10,240,100,50);
            myContext.strokeRect(490,240,100,50);
            myContext.fillRect(390,10,200,150);
            myContext.fillRect(10,10,200,150);
            myContext.clearRect(480,20,100,80);
            myContext.clearRect(100,20,100,80);
        </script>
    </body>
</html>
